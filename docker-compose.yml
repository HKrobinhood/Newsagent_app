services:
  postgres:
    image: postgres:16-alpine
    container_name: globalnewsai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: globalnewsai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalnewsai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - globalnewsai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: globalnewsai_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/globalnewsai
      DEBUG: "False"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gemini-1.5-pro}"
      SEARCH_API_KEY: "${SEARCH_API_KEY:-}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - globalnewsai_network

volumes:
  postgres_data:
    driver: local

networks:
  globalnewsai_network:
    driver: bridge
